server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Writable by the unprivileged nginx user.
    client_body_temp_path /tmp/nginx-cache;
    proxy_temp_path /tmp/nginx-cache;
    fastcgi_temp_path /tmp/nginx-cache;
    uwsgi_temp_path /tmp/nginx-cache;
    scgi_temp_path /tmp/nginx-cache;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed filenames, so these can be cached forever.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy is invisible.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Client side routing: unknown paths are application routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

services:
  web:
    build:
      context: .
      args:
        # Baked into the bundle at build time. Point it at wherever
        # blogs-server is reachable from the browser.
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8080/api}
    image: blogs-web:local
    ports:
      - '${WEB_PORT:-8590}:8080'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:8080/']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
